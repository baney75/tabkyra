# Blank issues stay on: the side panel's "Copy and open GitHub" and the /bug skill hand
# the user a finished report to paste.
blank_issues_enabled: true
contact_links:
  - name: Security vulnerability
    url: https://github.com/baney75/tabkyra/security/advisories/new
    about: Report it privately. Don't open a public issue. See SECURITY.md for scope and the email route.
  - name: Setup trouble
    url: https://github.com/baney75/tabkyra#faq
    about: Run tabkyra doctor first. It checks each piece and prints the command that fixes it. The FAQ covers the common cases.
