# Daily check that the published community catalog is current and verifiable (docs/decisions.md
# D27). Publishing needs a signing approval, so it runs only when its inputs change; this job
# catches anything that slipped: a rejected, failed or long-pending publish, a half-finished
# upload, a main that no longer builds a catalog, or an input change the publish triggers don't
# list. It holds no signing key and needs no approval.
#
# Three steps, so repo code never sees a token:
#   fetch:   gh only (token). Reads the release and pending publish runs, downloads the assets.
#   compare: main's CLI (no token). Verifies the published file and signature with the CLI's own
#            sync code and the committed key, and compares skills and revoked with a rebuild.
#   report:  gh only (token). Opens or comments on this workflow's own labeled issue, and closes
#            it once the catalog matches again.
name: Community catalog check

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install and build the CLI without install scripts
        working-directory: cli
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node node_modules/esbuild/install.js
          npm run build

      - name: Fetch the published catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/check"; mkdir -p "$out/published"
          # A publish started in the last day that is still pending or running isn't a miss yet.
          # One older than that is reported anyway, so an unanswered approval can't hide forever.
          since=$(date -u -d '24 hours ago' +%s)
          fresh=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow community-catalog.yml --limit 20 --json status,createdAt \
            --jq "[.[] | select(.status != \"completed\" and (.createdAt | fromdateiso8601) > $since)] | length")
          echo "$fresh" > "$out/fresh-pending"
          # Any error reading GitHub fails this job; only a real absence becomes a finding.
          if ! gh release view community-catalog --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[].name]' > "$out/assets.json" 2> "$out/view.err"; then
            if grep -qi "release not found" "$out/view.err"; then echo "[]" > "$out/assets.json"; else cat "$out/view.err"; exit 1; fi
          fi
          for name in community-catalog.json community-catalog.json.minisig; do
            if jq -e --arg n "$name" 'index($n)' "$out/assets.json" >/dev/null; then
              gh release download community-catalog --repo "$GITHUB_REPOSITORY" -D "$out/published" -p "$name"
            fi
          done

      - name: Verify and compare (no token)
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/check"; pub="$out/published"; reason=""
          if [ "$(cat "$out/fresh-pending")" != "0" ]; then
            echo "A publish started in the last day is still pending or running; not reporting yet."
            : > "$out/reason"; echo skip > "$out/state"; exit 0
          fi
          if [ ! -s "$pub/community-catalog.json" ] || [ ! -s "$pub/community-catalog.json.minisig" ]; then
            reason="The community-catalog release is missing community-catalog.json or its signature."
          elif ! TABKYRA_CONFIG_DIR="$(mktemp -d)" TABKYRA_COMMUNITY_URL="$pub" node cli/dist/index.js skill sync --json > "$out/sync.json" 2>&1; then
            reason="The published catalog doesn't verify: $(jq -r .message "$out/sync.json" 2>/dev/null || tail -3 "$out/sync.json")"
          elif ! node cli/dist/index.js skill catalog . --out "$out/rebuilt.json" --serial 1 --source "$GITHUB_SHA" > "$out/build.log" 2>&1; then
            reason="main at $GITHUB_SHA no longer builds a community catalog, so no publish can succeed: $(tail -5 "$out/build.log")"
          elif ! cmp -s <(jq -S '{skills, revoked}' "$out/rebuilt.json") <(jq -S '{skills, revoked}' "$pub/community-catalog.json"); then
            reason="The published catalog (built from $(jq -r .source "$pub/community-catalog.json")) differs from a catalog built from main at $GITHUB_SHA."
          fi
          printf '%s' "$reason" > "$out/reason"
          if [ -n "$reason" ]; then echo "::warning::$reason"; echo behind > "$out/state"; else echo "The published catalog verifies and matches main."; echo ok > "$out/state"; fi

      - name: Report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/check"; state=$(cat "$out/state")
          [ "$state" = skip ] && exit 0
          label=community-catalog-check
          gh label create "$label" --repo "$GITHUB_REPOSITORY" --color B60205 --description "Opened by the community catalog check" 2>/dev/null || true
          # Only this workflow's own labeled issue, never one a stranger titled the same way.
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label "$label" --author "app/github-actions" --json number --jq '.[0].number // empty')
          if [ "$state" = ok ]; then
            if [ -n "$open" ]; then gh issue close "$open" --repo "$GITHUB_REPOSITORY" --comment "The published catalog verifies and matches main at $GITHUB_SHA."; fi
            exit 0
          fi
          body="$(cat "$out/reason") Re-run the Community catalog workflow and approve its publish: \`gh workflow run community-catalog.yml --repo $GITHUB_REPOSITORY\`."
          if [ -n "$open" ]; then gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body "$body"
          else gh issue create --repo "$GITHUB_REPOSITORY" --title "Community catalog is behind main" --label "$label" --body "$body"; fi
