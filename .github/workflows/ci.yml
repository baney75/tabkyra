# Runs on every pull request and every push to main. Three jobs:
#   skills:           the gate for skills/. Lints every skill for hidden text, prompt
#                     injection, remote code, secret handling and structure, and runs the
#                     red-team tests that prove the lint still catches each attack. No
#                     install scripts run.
#   skill-regression: the skill router's gates (docs/skill-platform.md): the size budget,
#                     top-1 accuracy, false invokes, latency, the held-out floors, and every
#                     skill measuring at least its value in skills-eval/baseline.json, with no
#                     tolerance (a lower value needs an accepted drop). On a pull request the
#                     base branch's eval judges the pull request's skills, cases and router,
#                     which runs sandboxed in its own process. A change to the judge itself
#                     (skill-eval.ts or skill-router.ts) fails unless a maintainer adds the
#                     skill-judge-change label: CI can't judge a change to its own judge.
#   check:            the full build, format, type and test pass that a release runs.
# Nothing here gets a write token or a secret, so a pull request from a fork can't use CI
# to reach anything.
name: CI

on:
  pull_request:
    # labeled/unlabeled: the skill-judge-change label is part of the skill-regression gate.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

# Only superseded pull request runs are cancelled; every commit on main finishes its checks.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  skills:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install the CLI without install scripts
        working-directory: cli
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          # esbuild ships its binary through an install script; fetch it explicitly, pinned by the lockfile.
          node node_modules/esbuild/install.js

      - name: Build the CLI
        working-directory: cli
        run: npm run build

      - name: Lint every skill
        run: node cli/dist/index.js skill lint skills

      - name: Red-team the lint
        working-directory: cli
        run: node --test test/skill-lint.test.mjs

      # A pull request that weakens the lint must still pass the base branch's lint.
      - name: Lint with the base branch's lint
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth 1 origin "$BASE_SHA"
          git worktree add --detach ../base "$BASE_SHA"
          if [ ! -f ../base/cli/src/skill-lint.ts ]; then
            echo "The base branch has no skill lint yet."
            exit 0
          fi
          (cd ../base/cli && npm ci --ignore-scripts --no-audit --no-fund && node node_modules/esbuild/install.js && npm run build)
          node ../base/cli/dist/index.js skill lint skills

  skill-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install the CLI without install scripts
        working-directory: cli
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          # esbuild ships its binary through an install script; fetch it explicitly, pinned by the lockfile.
          node node_modules/esbuild/install.js

      - name: Build the CLI
        working-directory: cli
        run: npm run build

      # The lint's budget rule: every SKILL.md is 150 lines and 8,000 characters or fewer.
      - name: Lint and budget-check every skill
        run: node cli/dist/index.js skill lint skills

      # Top-1 accuracy, false invokes, cases per skill, p95 latency, the baseline snapshot and
      # the held-out floors.
      - name: Router eval and regression snapshot
        run: node cli/dist/index.js skill eval

      - name: Router, version, rollback and editor tests
        working-directory: cli
        run: node --test test/skill-router.test.mjs test/skill-platform.test.mjs

      # skill-eval.ts is the judge and skill-router.ts what it measures most. CI can't judge a
      # change to its own judge, so a maintainer decides, with a label only maintainers can add.
      - name: Changes to the judge need a maintainer's label
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          LABELED: ${{ contains(github.event.pull_request.labels.*.name, 'skill-judge-change') }}
        run: |
          git fetch --no-tags --depth 1 origin "$BASE_SHA"
          if git diff --quiet "$BASE_SHA" HEAD -- cli/src/skill-eval.ts cli/src/skill-router.ts; then
            echo "No change to cli/src/skill-eval.ts or cli/src/skill-router.ts."
            exit 0
          fi
          if [ "$LABELED" = "true" ]; then
            echo "The judge changed, and a maintainer added the skill-judge-change label."
            exit 0
          fi
          echo "::error::This pull request changes cli/src/skill-eval.ts or cli/src/skill-router.ts. Those are the router's judge and its subject, and CI can't judge a change to its own judge: a weakened gate would pass here and then judge every later pull request. A maintainer must review the change and add the skill-judge-change label."
          exit 1

      # The base branch's eval (gate logic and thresholds) judges the pull request's skills,
      # cases, baseline and router. The router runs in its own process, sandboxed, and the case
      # labels are moved out of every checkout first, so the router can't read them.
      - name: Router gates from the base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add --detach ../base "$BASE_SHA"
          if [ ! -f ../base/cli/src/skill-eval.ts ]; then
            echo "The base branch has no skill eval yet."
            exit 0
          fi
          judge="$RUNNER_TEMP/judge"
          mkdir -p "$judge/head/skills-eval" "$judge/head/cli/src" "$judge/base"
          git worktree add --detach ../base-code "$BASE_SHA"
          # 1. The judge: the base CLI, built with the base router, bundling the pull request's
          #    skills (the catalog follows skills/, so new ones are indexed and removed ones
          #    don't break the build).
          rm -rf ../base-code/skills
          cp -R skills ../base-code/skills
          node ../base-code/cli/scripts/skills-catalog.mjs
          (cd ../base-code/cli && npm ci --ignore-scripts --no-audit --no-fund && node node_modules/esbuild/install.js && npm run build)
          # 2. The subject: the pull request's router, built alone into the base's
          #    router-worker.ts. It must type-check against the base eval and CLI.
          cp cli/src/skill-router.ts ../base-code/cli/src/skill-router.ts
          if ! (cd ../base-code/cli && npx tsc --noEmit); then
            echo "::error::The pull request's cli/src/skill-router.ts doesn't compile against the base branch's skill-eval.ts and CLI. The router and the eval API changed together, so this needs a maintainer's review; there is no fallback."
            exit 1
          fi
          (cd ../base-code/cli && npx esbuild src/router-worker.ts --bundle --platform=node --format=esm --log-level=warning --outfile="$judge/router.mjs")
          # 3. The labels, moved where only the judge reads them.
          cp skills-eval/* "$judge/head/skills-eval/"
          cp cli/src/skill-eval.ts "$judge/head/cli/src/"
          cp -R ../base/skills-eval "$judge/base/"
          rm -f skills-eval/*.jsonl ../base/skills-eval/*.jsonl ../base-code/skills-eval/*.jsonl
          status=0
          node ../base-code/cli/dist/index.js skill eval --base "$judge/base" --cases "$judge/head/skills-eval/router-cases.jsonl" --router "$judge/router.mjs" --json > "$judge/base-eval.json" || status=$?
          expected=$(find skills -mindepth 2 -maxdepth 2 -name SKILL.md | wc -l | tr -d ' ')
          node -e '
            const text = require("fs").readFileSync(process.argv[2], "utf8");
            if (!text.trim()) { console.log("FAIL the judge reported no gates; its error is above"); process.exit(1); }
            const r = JSON.parse(text);
            for (const g of r.gates) console.log(`${g.ok ? "ok  " : "FAIL"} ${g.gate}: ${g.detail}`);
            if (r.skills !== Number(process.argv[1])) { console.log(`FAIL the judge indexed ${r.skills} skills; skills/ has ${process.argv[1]}`); process.exit(1); }
          ' "$expected" "$judge/base-eval.json"
          exit "$status"

  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tabkyra
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Check out the pinned siblings and install
        run: ./tabkyra/scripts/setup-siblings.sh

      - name: Build
        working-directory: tabkyra
        env:
          TABKYRA_NO_BUMP: "1"
        run: |
          npm run build
          (cd cli && npm run build)

      - name: Test
        working-directory: tabkyra
        run: |
          npx biome check .
          npx tsc --noEmit
          node --import tsx --test test/*.test.mjs
          (cd cli && npx tsc --noEmit && npm test)
