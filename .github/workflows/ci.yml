# Runs on every pull request and every push to main. Four jobs:
#   skills:           the gate for skills/. Lints every skill for hidden text, prompt
#                     injection, remote code, secret handling and structure, and runs the
#                     red-team tests that prove the lint still catches each attack. No
#                     install scripts run.
#   skill-regression: the pull request's own skill router gates (docs/skill-platform.md):
#                     the size budget, top-1 accuracy, false invokes, latency, the held-out
#                     floors, and every skill measuring at least its value in
#                     skills-eval/baseline.json, with no tolerance (a lower value needs an
#                     accepted drop).
#   skill-judge:      pull requests only. The base branch's eval judges the pull request's
#                     skills, cases and router. It checks out the base and reads the pull
#                     request's files as data, so no pull request code runs before the judge
#                     is built; the router then runs sandboxed in its own process. A change
#                     to the judge itself (skill-eval.ts or skill-router.ts) fails unless a
#                     maintainer adds the skill-judge-change label, and a later push that
#                     changes the judge voids it (skill-judge-label.yml removes it).
#   check:            the full build, format, type and test pass that a release runs.
# Nothing here gets a write token or a secret, so a pull request from a fork can't use CI
# to reach anything.
name: CI

on:
  pull_request:
    # labeled/unlabeled: the skill-judge-change label is part of the skill-judge gate.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

# Only superseded pull request runs are cancelled; every commit on main finishes its checks.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  skills:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install the CLI without install scripts
        working-directory: cli
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          # esbuild ships its binary through an install script; fetch it explicitly, pinned by the lockfile.
          node node_modules/esbuild/install.js

      - name: Build the CLI
        working-directory: cli
        run: npm run build

      - name: Lint every skill
        run: node cli/dist/index.js skill lint skills

      - name: Red-team the lint
        working-directory: cli
        run: node --test test/skill-lint.test.mjs

      # A pull request that weakens the lint must still pass the base branch's lint.
      - name: Lint with the base branch's lint
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth 1 origin "$BASE_SHA"
          git -c core.hooksPath=/dev/null worktree add --detach ../base "$BASE_SHA"
          if [ ! -f ../base/cli/src/skill-lint.ts ]; then
            echo "The base branch has no skill lint yet."
            exit 0
          fi
          (cd ../base/cli && npm ci --ignore-scripts --no-audit --no-fund && node node_modules/esbuild/install.js && npm run build)
          node ../base/cli/dist/index.js skill lint skills

  skill-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install the CLI without install scripts
        working-directory: cli
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          # esbuild ships its binary through an install script; fetch it explicitly, pinned by the lockfile.
          node node_modules/esbuild/install.js

      - name: Build the CLI
        working-directory: cli
        run: npm run build

      # The lint's budget rule: every SKILL.md is 150 lines and 8,000 characters or fewer.
      - name: Lint and budget-check every skill
        run: node cli/dist/index.js skill lint skills

      # Top-1 accuracy, false invokes, cases per skill, p95 latency, the baseline snapshot and
      # the held-out floors.
      - name: Router eval and regression snapshot
        run: node cli/dist/index.js skill eval

      - name: Router, version, rollback and editor tests
        working-directory: cli
        run: node --test test/skill-router.test.mjs test/skill-platform.test.mjs test/judge-label.test.mjs

  # The judge: the base branch's eval, run on the pull request's skills, cases and router. It
  # checks out the base only and reads the pull request's files as data (git show/archive);
  # no pull request code runs here before the judge is built, and the pull request's router
  # then runs only inside the judge's sandboxed child process.
  skill-judge:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Fetch the pull request as data
        env:
          PR: ${{ github.event.pull_request.number }}
        run: git -c core.hooksPath=/dev/null fetch --no-tags --depth 1 origin "+refs/pull/$PR/head:refs/remotes/pr/head"

      # skill-eval.ts is the judge and skill-router.ts what it measures most. CI can't judge a
      # change to its own judge, so a maintainer decides, with a label only maintainers can add.
      # The label approves one version of the judge: a push that changes it voids the approval
      # (.github/scripts/judge-label.mjs, which also removes the label on pull_request_target).
      - name: Changes to the judge need a maintainer's label
        env:
          LABELED: ${{ contains(github.event.pull_request.labels.*.name, 'skill-judge-change') }}
          ACTION: ${{ github.event.action }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet HEAD pr/head -- cli/src/skill-eval.ts cli/src/skill-router.ts; then
            echo "No change to cli/src/skill-eval.ts or cli/src/skill-router.ts."
            exit 0
          fi
          if [ "$LABELED" != "true" ]; then
            echo "::error::This pull request changes cli/src/skill-eval.ts or cli/src/skill-router.ts. Those are the router's judge and its subject, and CI can't judge a change to its own judge: a weakened gate would pass here and then judge every later pull request. A maintainer must review the change and add the skill-judge-change label."
            exit 1
          fi
          if [ "$ACTION" = "synchronize" ]; then
            if [ ! -f .github/scripts/judge-label.mjs ]; then
              echo "::error::This push may change the judge, and the base branch can't check that yet. A maintainer must review it and add the skill-judge-change label again."
              exit 1
            fi
            node .github/scripts/judge-label.mjs check
          fi
          echo "The judge changed, and a maintainer approved this version with the skill-judge-change label."

      - name: Judge the pull request's router and skills
        run: |
          if [ ! -f cli/src/skill-eval.ts ]; then
            echo "The base branch has no skill eval yet."
            exit 0
          fi
          judge="$RUNNER_TEMP/judge"
          mkdir -p "$judge/head/skills-eval" "$judge/head/cli/src" "$judge/base"
          # The base branch's own case files, for the comparisons, then out of the checkout.
          cp -R skills-eval "$judge/base/"
          # The pull request's files, as data. Its skills must be plain files.
          rm -rf skills
          git archive pr/head skills | tar -x --no-same-owner
          if [ -n "$(find skills -type l)" ]; then echo "::error::skills/ holds a symbolic link."; exit 1; fi
          for f in router-cases.jsonl router-heldout.jsonl baseline.json accepted-drops.json; do
            if git cat-file -e "pr/head:skills-eval/$f" 2>/dev/null; then git show "pr/head:skills-eval/$f" > "$judge/head/skills-eval/$f"; fi
          done
          git show pr/head:cli/src/skill-eval.ts > "$judge/head/cli/src/skill-eval.ts"
          rm -f skills-eval/*.jsonl
          # 1. The judge: the base CLI with the base router, bundling the pull request's skills
          #    (the catalog follows skills/, so new ones are indexed and removed ones don't break
          #    the build).
          node cli/scripts/skills-catalog.mjs
          (cd cli && npm ci --ignore-scripts --no-audit --no-fund && node node_modules/esbuild/install.js && npm run build)
          # 2. The subject: the pull request's router, built alone into the base's
          #    router-worker.ts. It must type-check against the base eval and CLI.
          git show pr/head:cli/src/skill-router.ts > cli/src/skill-router.ts
          if ! (cd cli && npx tsc --noEmit); then
            echo "::error::The pull request's cli/src/skill-router.ts doesn't compile against the base branch's skill-eval.ts and CLI. The router and the eval API changed together, so this needs a maintainer's review; there is no fallback."
            exit 1
          fi
          (cd cli && npx esbuild src/router-worker.ts --bundle --platform=node --format=esm --log-level=warning --outfile="$judge/router.mjs")
          status=0
          node cli/dist/index.js skill eval --base "$judge/base" --cases "$judge/head/skills-eval/router-cases.jsonl" --router "$judge/router.mjs" --json > "$judge/base-eval.json" || status=$?
          expected=$(find skills -mindepth 2 -maxdepth 2 -name SKILL.md | wc -l | tr -d ' ')
          node -e '
            const text = require("fs").readFileSync(process.argv[2], "utf8");
            if (!text.trim()) { console.log("FAIL the judge reported no gates; its error is above"); process.exit(1); }
            const r = JSON.parse(text);
            for (const g of r.gates) console.log(`${g.ok ? "ok  " : "FAIL"} ${g.gate}: ${g.detail}`);
            if (r.skills !== Number(process.argv[1])) { console.log(`FAIL the judge indexed ${r.skills} skills; skills/ has ${process.argv[1]}`); process.exit(1); }
          ' "$expected" "$judge/base-eval.json"
          exit "$status"

  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tabkyra
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Check out the pinned siblings and install
        run: ./tabkyra/scripts/setup-siblings.sh

      - name: Build
        working-directory: tabkyra
        env:
          TABKYRA_NO_BUMP: "1"
        run: |
          npm run build
          (cd cli && npm run build)

      - name: Test
        working-directory: tabkyra
        run: |
          npx biome check .
          npx tsc --noEmit
          node --import tsx --test test/*.test.mjs
          (cd cli && npx tsc --noEmit && npm test)
