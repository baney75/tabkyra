<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<title>Tabkyra: microphone for dictation</title>
	<link rel="stylesheet" href="app.css" />
	<script src="theme-loader.js"></script>
</head>
<body class="min-h-screen bg-background text-foreground flex items-center justify-center p-8">
	<main class="max-w-md space-y-3">
		<h1 class="text-lg font-semibold">Microphone for dictation</h1>
		<p class="text-sm text-muted-foreground">
			Tabkyra turns your speech into text on this computer. The audio never leaves your browser.
			Chrome asks for the microphone here once, because the side panel can't show the question.
		</p>
		<p id="status" class="text-sm" role="status">Asking for the microphone…</p>
	</main>
	<script type="module" src="mic-permission.js"></script>
</body>
</html>
