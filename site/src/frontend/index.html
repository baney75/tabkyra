<!DOCTYPE html>
<html lang="en" class="dark bg-background text-foreground">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabkyra: a browser agent your other agents can drive</title>
    <meta name="description" content="Tabkyra is a Chromium side-panel agent with a local MCP bridge, so Claude Code, Codex, OpenCode and Cursor can drive your real browser in background tabs.">
    <link rel="icon" href="/tabkyra-icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="app.css">
    <script>
        localStorage.setItem("theme", "dark");
        document.documentElement.classList.add("dark");
    </script>
</head>
<body class="px-4 py-6 md:py-12">
    <a href="https://github.com/baney75/tabkyra" target="_blank" class="fixed top-5 right-5 z-50 text-muted-foreground/50 hover:text-foreground transition-colors" aria-label="View on GitHub" title="View on GitHub">
        <svg width="24" height="24" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
    </a>
    <main class="max-w-3xl mx-auto w-full">
        <header class="text-center mb-16">
            <img src="/tabkyra-icon.svg" alt="" width="96" height="96" class="mx-auto mb-6">
            <h1 class="text-4xl md:text-5xl mb-6 font-bold">Tabkyra</h1>
            <p class="text-xl md:text-2xl text-muted-foreground">A browser agent in your side panel that your other agents can drive.</p>
            <p class="text-sm text-muted-foreground mt-4">The name joins <em>tab</em> and the Greek <em>kybernētēs</em>, helmsman.</p>
        </header>
        <div class="text-center mb-16">
            <a href="https://github.com/baney75/tabkyra#quick-start" class="inline-block px-8 py-4 text-lg font-medium rounded-lg bg-orange-500/20 hover:bg-orange-500/30 border border-orange-500/50 text-foreground transition-all">Install from GitHub</a>
        </div>
        <footer class="text-center text-sm text-muted-foreground">
            <p>Tabkyra is a fork of <a href="https://github.com/badlogic/sitegeist" class="text-foreground underline">Sitegeist</a> by Mario Zechner. AGPL-3.0.</p>
        </footer>
    </main>
    <script type="module" src="./main.ts"></script>
</body>
</html>
